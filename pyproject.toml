[build-system]
requires = [
    "maturin>=1.16,<2.0",
]
build-backend = "maturin"

[project]
name = "oxirinth"
version = "0.1.0"
description = "High-performance Python SDK for the Modrinth API v3, powered by Rust and Pydantic v2."
authors = [
    { name = "Henrique Moreira", email = "78804989+henrique-coder@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.11, <3.16"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "api",
    "minecraft",
    "modrinth",
    "pydantic",
    "pyo3",
    "rust",
    "sdk",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.12.0, <3.0.0",
]

[project.urls]
Changelog = "https://github.com/henrique-coder/oxirinth/blob/prod/CHANGELOG.md"
Discussions = "https://github.com/henrique-coder/oxirinth/discussions"
Documentation = "https://oxirinth.readthedocs.io"
Funding = "https://github.com/sponsors/henrique-coder"
Homepage = "https://github.com/henrique-coder/oxirinth"
Issues = "https://github.com/henrique-coder/oxirinth/issues"
Repository = "https://github.com/henrique-coder/oxirinth.git"
Security = "https://github.com/henrique-coder/oxirinth/security/policy"

[dependency-groups]
dev = [
    { include-group = "docs" },
    { include-group = "hooks" },
    { include-group = "lint" },
    { include-group = "tests" },
    { include-group = "workflow" },
    "maturin>=1.16,<2.0",
]
docs = [
    "zensical>=0.1.0",
]
hooks = [
    "prek>=0.4.0",
]
lint = [
    "ruff>=0.16.0",
    "ty>=0.0.60",
]
tests = [
    "mypy>=1.15.0",
    "pytest-asyncio>=0.25.0",
    "pytest>=8.3.0",
]
workflow = [
    "zizmor>=1.28.0",
]

[tool.maturin]
manifest-path = "rust/oxirinth-py/Cargo.toml"
python-source = "src"
module-name = "oxirinth._core"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "rust/**/Cargo.toml" },
    { file = "rust/**/*.rs" },
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live: opt-in tests that hit live https://api.modrinth.com",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = [
    "ANN",
    "B",
    "C4",
    "D",
    "E",
    "ERA",
    "F",
    "FA",
    "FURB",
    "G",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PTH",
    "RET",
    "RSE",
    "RUF",
    "SIM",
    "T20",
    "TCH",
    "TRY",
    "UP",
    "W",
]
ignore = [
    "ANN401",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D203",
    "D213",
    "G004",
    "ISC001",
    "PLE1205",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR2004",
    "TRY003",
    "TRY301",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
skip-magic-trailing-comma = false

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true
allow-star-arg-any = true

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["oxirinth"]
lines-after-imports = 2
split-on-trailing-comma = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.rules]
division-by-zero = "warn"
index-out-of-bounds = "warn"
invalid-argument-type = "error"
invalid-explicit-return = "error"
missing-argument = "error"
possibly-missing-attribute = "warn"
redundant-cast = "warn"
too-many-positional-arguments = "error"
missing-attribute = "error"
import-not-found = "error"
unused-ignore-comment = "warn"
unsupported-operator = "error"
