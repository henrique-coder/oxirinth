[workspace]
resolver = "3"
members = [
    "rust/oxirinth-engine",
    "rust/oxirinth-py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/henrique-coder/oxirinth"
publish = false

[workspace.dependencies]
bytes = "1.12.2"
dirs = "7.0.0"
http = "1.5.0"
lru = "0.19.0"
parking_lot = "0.13.0"
pyo3 = "0.30.1"
pyo3-async-runtimes = { version = "0.30.0", features = ["tokio-runtime"] }
redb = "5.0.0"
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls-no-provider",
    "http2",
    "charset",
    "gzip",
    "brotli",
    "zstd",
    "system-proxy",
] }
reqwest-middleware = "0.5.2"
reqwest-retry = "0.9.1"
rustls = { version = "0.23.46", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
] }
tracing = "0.1.44"
url = "2.5.8"
wiremock = "0.6.5"
zstd = "0.14.4"

[workspace.lints.clippy]
all = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"
