name: CI

on:
  push:
    branches:
      - prod
  pull_request:
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_PYTHON: "3.14"

jobs:
  rust:
    name: Rust Engine & Bridge
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust Build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: ${{ env.CI_PYTHON }}
          enable-cache: false

      - name: Check Rust Formatting & Clippy
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust Engine Unit & Integration Tests
        run: cargo test -p oxirinth-engine

  quality:
    name: Lint, Types, Stubs & Docs
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Rust Build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "10"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install pnpm Tooling
        run: pnpm install --frozen-lockfile

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: ${{ env.CI_PYTHON }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python Dependencies & Build Extension
        run: uv sync --frozen --python "$CI_PYTHON" --all-groups

      - name: Run Quality, Stubtest & Security Checks
        run: |
          uv run --python "$CI_PYTHON" --no-sync ruff check
          uv run --python "$CI_PYTHON" --no-sync ruff format --check
          uv run --python "$CI_PYTHON" --no-sync ty check
          uv run --python "$CI_PYTHON" --no-sync python -m mypy.stubtest oxirinth._core
          pnpm prettier --check .
          pnpm taplo lint Cargo.toml pyproject.toml zensical.toml rust/oxirinth-engine/Cargo.toml rust/oxirinth-py/Cargo.toml
          uv run --python "$CI_PYTHON" --no-sync zizmor .github/workflows

      - name: Build Documentation Strictly
        run: uv run --python "$CI_PYTHON" --no-sync zensical build --clean --strict

  test_python:
    name: Python (${{ matrix.os }} / ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
        include:
          - os: ubuntu-latest
            python-version: "3.14t"

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Rust Build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build Extension & Run Pytest
        env:
          TEST_PYTHON: ${{ matrix.python-version }}
        run: |
          uv sync --frozen --python "$TEST_PYTHON" --no-dev --group tests
          uv run --python "$TEST_PYTHON" --no-sync pytest -v
